name: Smart Campus Analytics CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r smart-campus-analytics/requirements.txt

      - name: Lint with flake8
        run: |
          cd smart-campus-analytics
          flake8 src/ dashboard/ tests/ \
            --max-line-length=100 \
            --extend-ignore=E501,W503 \
            --exclude=__pycache__,.venv

      - name: Generate synthetic data
        run: |
          cd smart-campus-analytics
          python src/ingestion/generate_data.py

      - name: Run preprocessing pipeline
        run: |
          cd smart-campus-analytics
          python src/preprocessing/clean.py

      - name: Run feature engineering
        run: |
          cd smart-campus-analytics
          python src/features/engineer.py

      - name: Run unit tests
        run: |
          cd smart-campus-analytics
          pytest tests/ -v --tb=short -x

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cd smart-campus-analytics
          docker build -t smart-campus-analytics:ci .

      - name: Verify container starts
        run: |
          docker run --rm -d --name test_container \
            -p 8501:8501 smart-campus-analytics:ci
          sleep 10
          docker stop test_container || true
